services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep Mode"]
      interval: 10s
      timeout: 5s
      retries: 12

  broker:
    image: confluentinc/cp-kafka:7.5.0
    hostname: broker
    container_name: broker
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18

  producer:
    build:
      context: ./data_producer
      args:
        script: normal_transaction_producer.py
    depends_on:
      broker:
        condition: service_healthy
    environment:
      - KAFKA_BROKERS=broker:29092
      - KAFKA_TOPIC=raw_transactions
    restart: unless-stopped

  hacker-producer:
    build:
      context: ./data_producer
      args:
        script: hacker_transaction_producer.py
    depends_on:
      broker:
        condition: service_healthy
    environment:
      - KAFKA_BROKERS=broker:29092
      - KAFKA_TOPIC=raw_transactions
    restart: unless-stopped

  crypto-producer:
    build:
      context: ./data_producer
      args:
        script: crypto_trade_producer.py
    depends_on:
      broker:
        condition: service_healthy
    environment:
      - KAFKA_BROKERS=broker:29092
      - KAFKA_TOPIC=crypto_trades
      - CRYPTO_SYMBOLS=btcusdt,ethusdt,solusdt,dogeusdt
    restart: unless-stopped

  spark-master:
    build:
      context: ./data_processor
      dockerfile: Dockerfile.spark  # Use the custom Dockerfile
    container_name: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    environment:
      - HOME=/home/spark
      - SPARK_USER=spark
    ports:
      - "8080:8080"  # Spark master web UI
      - "7077:7077"  # Spark master port
    volumes:
      - ./data_processor:/opt/spark-apps  # Mount the directory containing fraud_detector.py

  spark-worker-1:
    build:
      context: ./data_processor
      dockerfile: Dockerfile.spark  # Use the custom Dockerfile
    container_name: spark-worker-1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--cores", "1", "--memory", "1G", "--webui-port", "8081"]
    environment:
      - HOME=/home/spark
      - SPARK_USER=spark
    depends_on:
      spark-master:
        condition: service_started
    ports:
      - "8081:8081"  # Spark worker web UI

  spark-worker-2:
    build:
      context: ./data_processor
      dockerfile: Dockerfile.spark  # Use the custom Dockerfile
    container_name: spark-worker-2
    environment:
      - HOME=/home/spark
      - SPARK_USER=spark
    depends_on:
      broker:
        condition: service_healthy
      spark-master:
        condition: service_started
      spark-worker-1:
        condition: service_started
      timescaledb:
        condition: service_healthy
      producer:
        condition: service_started
    ports:
      - "8082:8081"  # Spark worker web UI
    volumes:
      - ./data_processor:/opt/spark-apps
    command: ["/bin/bash", "-c", "cd /opt/spark-apps/ && /opt/spark/bin/spark-submit --master spark://spark-master:7077 --deploy-mode client --conf spark.jars.ivy=/tmp/.ivy2 --packages org.postgresql:postgresql:42.7.4,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.2 fraud_detector.py"]
    restart: unless-stopped

  wash-detector:
    build:
      context: ./data_processor
      dockerfile: Dockerfile.spark
    container_name: wash-detector
    environment:
      - HOME=/home/spark
      - SPARK_USER=spark
    depends_on:
      broker:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      crypto-producer:
        condition: service_started
    ports:
      - "8083:8081"
    volumes:
      - ./data_processor:/opt/spark-apps
      - ./model_build:/opt/model-build
    command: ["/bin/bash", "-c", "cd /opt/spark-apps/ && /opt/spark/bin/spark-submit --master local[2] --conf spark.jars.ivy=/tmp/.ivy2 --packages org.postgresql:postgresql:42.7.4,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.2 wash_trade_detector.py"]
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg14
    environment:
      POSTGRES_DB: fraud_detection
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./monitoring/init.sql:/docker-entrypoint-initdb.d/init.sql  # Mount the SQL initialization file
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d fraud_detection"]
      interval: 10s
      timeout: 5s
      retries: 12

  grafana:
    build:
      context: ./monitoring/grafana-dashboard
      dockerfile: Dockerfile  # Use the custom Dockerfile
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped
